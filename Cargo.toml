[package]
name = "katala-web-research-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Native Rust migration of Katala Web Research"
publish = false

[[bin]]
name = "kwr-rs"
path = "rust/src/main.rs"

[lib]
name = "kwr"
path = "rust/src/lib.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.37.0", features = ["bundled", "backup"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
sha2 = "0.10.9"
tempfile = "3.23.0"

roxmltree = "0.21.1"
html-escape = "0.2.13"
regex = "1.11.3"
url = "2.5.7"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
encoding_rs = "=0.8.35"

[profile.release]
lto = "thin"
strip = "symbols"

[[test]]
name = "migration"
path = "rust/tests/migration.rs"

[[test]]
name = "golden"
path = "rust/tests/golden.rs"

[[test]]
name = "feeds"
path = "rust/tests/feeds.rs"

[[example]]
name = "http_probe"
path = "rust/tests/support/http_probe.rs"

[[test]]
name = "http"
path = "rust/tests/http.rs"

[[test]]
name = "providers"
path = "rust/tests/providers.rs"
