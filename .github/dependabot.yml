# repo-standardize が置いた依存の自動更新。種類ごとに週1回、まとめて1本の PR にする。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # 公開されたばかりの版は乗っ取り・誤公開の直後であることが多い。7日待ってから上げる。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # 公開されたばかりの版は乗っ取り・誤公開の直後であることが多い。7日待ってから上げる。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
