name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository published the operator's home paths in eight documents for three
  # months while CI was green, because CI only ran the tests. The gate is shared with
  # the rest of the organisation so a blind spot found anywhere closes here too.
  no-instance-data:
    uses: katalalab/.github/.github/workflows/instance-data-gate.yml@main

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run repository verifier
        run: bash scripts/verify.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff mypy
      - name: ruff check
        run: ruff check src/
      - name: mypy
        run: mypy src/katala_web_research/
